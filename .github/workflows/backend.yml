name: Backend

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  id-token: write # OIDC login to AWS (only used on main, for the ECR push)

concurrency:
  group: backend-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE_NAME: taskboard-backend
  PYTHON_VERSION: "3.13"

jobs:
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.diff.outputs.run }}
    steps:
      - uses: actions/checkout@PIN_SHA # vX.Y.Z
        with:
          fetch-depth: 0
      - id: diff
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          ZERO=0000000000000000000000000000000000000000
          if [ -z "$BASE" ] || [ "$BASE" = "$ZERO" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          if git diff --name-only "$BASE" "$GITHUB_SHA" \
             | grep -qE '^(app/backend/|\.github/actions/|\.github/workflows/backend\.yml)'; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

  backend:
    name: Backend
    needs: changes
    if: needs.changes.outputs.run == 'true'
    runs-on: ubuntu-latest
    # ... باقي الـ job زي ما هو بدون أي تغيير ...

  backend-passed:
    name: Backend passed
    if: ${{ always() }}
    needs: [changes, backend]
    runs-on: ubuntu-latest
    steps:
      - name: Fail if the backend job failed or was cancelled
        env:
          RESULT: ${{ needs.backend.result }}
        run: |
          echo "backend result: $RESULT"
          if [ "$RESULT" = "failure" ] || [ "$RESULT" = "cancelled" ]; then exit 1; fi