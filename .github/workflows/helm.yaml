name: Helm

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: helm-${{ github.ref }}
  cancel-in-progress: true

env:
  CHART_DIR: deploy/helm/taskboard 

jobs:
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.diff.outputs.run }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - id: diff
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          ZERO=0000000000000000000000000000000000000000
          if [ -z "$BASE" ] || [ "$BASE" = "$ZERO" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          if git diff --name-only "$BASE" "$GITHUB_SHA" \
             | grep -qE '^(helm/|\.github/actions/|\.github/workflows/helm\.yml)'; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

  helm:
    name: Helm
    needs: changes
    if: needs.changes.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Set up Helm
        uses: azure/setup-helm@v5.0.1

      - name: Lint (default values)
        run: helm lint "$CHART_DIR"

      - name: Lint (prod values)
        run: helm lint "$CHART_DIR" -f "$CHART_DIR/values-prod.yaml"

      - name: Render both value sets
        run: |
          mkdir -p rendered
          helm template taskboard "$CHART_DIR" > rendered/default.yaml
          helm template taskboard "$CHART_DIR" -f "$CHART_DIR/values-prod.yaml" > rendered/prod.yaml

      - name: Scan chart for misconfigurations
        uses: ./.github/actions/post-build-scan
        with:
          scan-type: fs
          target: ${{ env.CHART_DIR }}
          scanners: misconfig
          artifact-name: helm-misconfig-scan
          severity: HIGH,CRITICAL

      - name: Upload rendered manifests
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: helm-rendered
          path: rendered
          retention-days: 5

  helm-passed:
    name: Helm passed
    if: ${{ always() }}
    needs: [changes, helm]
    runs-on: ubuntu-latest
    steps:
      - name: Fail if the helm job failed or was cancelled
        env:
          RESULT: ${{ needs.helm.result }}
        run: |
          echo "helm result: $RESULT"
          if [ "$RESULT" = "failure" ] || [ "$RESULT" = "cancelled" ]; then exit 1; fi