name: Frontend

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: frontend-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "22" # same as the frontend Dockerfile

jobs:
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.diff.outputs.run }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - id: diff
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          ZERO=0000000000000000000000000000000000000000
          if [ -z "$BASE" ] || [ "$BASE" = "$ZERO" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          if git diff --name-only "$BASE" "$GITHUB_SHA" \
             | grep -qE '^(app/frontend/|\.github/actions/|\.github/workflows/frontend\.yml)'; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

  frontend:
    name: Frontend
    needs: changes
    if: needs.changes.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: app/frontend/package-lock.json

      - name: Install dependencies
        working-directory: app/frontend
        run: npm ci

      - name: Lint
        working-directory: app/frontend
        run: npm run lint --if-present

      - name: Type check
        working-directory: app/frontend
        run: npm run typecheck

      - name: Pre-build scan
        uses: ./.github/actions/pre-build-scan
        with:
          path: app/frontend
          artifact-name: frontend-pre-scan
          sonar-project-key: taskboard-frontend
          sonar-organization: ${{ vars.SONAR_ORGANIZATION }}
          sonar-token: ${{ secrets.SONAR_TOKEN }}
          sonar-args: >-
            -Dsonar.exclusions=node_modules/**,out/**,.next/**

      - name: Build
        working-directory: app/frontend
        run: npm run build
        # next.config.ts has output: "export", so this writes the static site to app/frontend/out

      - name: Check the build output exists
        run: test -f app/frontend/out/index.html

      - name: Post-build scan (static output)
        uses: ./.github/actions/post-build-scan
        with:
          scan-type: fs
          target: app/frontend/out
          artifact-name: frontend-post-scan
          severity: CRITICAL

      - name: Upload the built site
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: frontend-out-${{ github.sha }}
          path: app/frontend/out
          retention-days: 30
          if-no-files-found: error

  frontend-passed:
    name: Frontend passed
    if: ${{ always() }}
    needs: [changes, frontend]
    runs-on: ubuntu-latest
    steps:
      - name: Fail if the frontend job failed or was cancelled
        env:
          RESULT: ${{ needs.frontend.result }}
        run: |
          echo "frontend result: $RESULT"
          if [ "$RESULT" = "failure" ] || [ "$RESULT" = "cancelled" ]; then exit 1; fi
