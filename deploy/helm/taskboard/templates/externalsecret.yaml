{{- if eq .Values.credentials.mode "external" }}
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: {{ include "taskboard.fullname" . }}-aws
  labels:
    {{- include "taskboard.labels" . | nindent 4 }}
spec:
  provider:
    aws:
      service: SecretsManager
      region: {{ .Values.credentials.external.region }}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ include "taskboard.secretName" . }}
  labels:
    {{- include "taskboard.labels" . | nindent 4 }}
spec:
  refreshInterval: {{ .Values.credentials.external.refreshInterval }}
  secretStoreRef:
    name: {{ include "taskboard.fullname" . }}-aws
    kind: SecretStore
  target:
    name: {{ include "taskboard.secretName" . }}
    creationPolicy: Owner
  data:
    - secretKey: DB_PASSWORD
      remoteRef:
        key: {{ required "credentials.external.secretName is required" .Values.credentials.external.secretName }}
        {{- with .Values.credentials.external.property }}
        property: {{ . }}
        {{- end }}
{{- end }}