apiVersion: v1
kind: Pod
metadata:
  name: {{ include "taskboard.fullname" . }}-test
  labels:
    {{- include "taskboard.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": test
    "helm.sh/hook-delete-policy": before-hook-creation
spec:
  restartPolicy: Never
  securityContext:
    runAsNonRoot: true
    runAsUser: 10001
    seccompProfile:
      type: RuntimeDefault
  containers:
    - name: api-test
      image: "{{ .Values.backend.image.repository }}:{{ .Values.backend.image.tag }}"
      imagePullPolicy: {{ .Values.backend.image.pullPolicy }}
      env:
        - name: BASE_URL
          value: http://{{ include "taskboard.fullname" . }}-backend:{{ .Values.backend.port }}
      command: ["python", "-c"]
      args:
        - |
          import json, os, urllib.request
          base = os.environ["BASE_URL"] + "/api/tasks"
          hdr = {"Content-Type": "application/json"}
          req = urllib.request.Request(base, data=json.dumps({"title": "helm-test"}).encode(), headers=hdr, method="POST")
          created = json.load(urllib.request.urlopen(req, timeout=10))
          tasks = json.load(urllib.request.urlopen(base, timeout=10))
          assert any(t["id"] == created["id"] for t in tasks), "created task not found"
          urllib.request.urlopen(urllib.request.Request(base + "/" + str(created["id"]), method="DELETE"), timeout=10)
          print("OK: task created, read and deleted")
      securityContext:
        {{- include "taskboard.containerSecurityContext" . | nindent 8 }}