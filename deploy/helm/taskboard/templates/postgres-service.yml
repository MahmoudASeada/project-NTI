apiVersion: v1
kind: Service
metadata:
  name: {{ include "taskboard.fullname" . }}-postgres
  labels:
    {{- include "taskboard.labels" . | nindent 4 }}
    app.kubernetes.io/component: postgres
spec:
  clusterIP: None
  ports:
    - name: postgres
      port: {{ .Values.database.port }}
      targetPort: postgres
  selector:
    {{- include "taskboard.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: postgres